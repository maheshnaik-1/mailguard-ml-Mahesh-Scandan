# Rengoku fire theme: tables (st.dataframe) are canvas-drawn, so they are colored here, not with CSS.
[theme]
base = "dark"
primaryColor = "#ffb703"
backgroundColor = "#10070a"
secondaryBackgroundColor = "#1b0d12"
textColor = "#f8eee8"
dataframeHeaderBackgroundColor = "#30171b"
dataframeHeaderTextColor = "#f5ded1"
dataframeBorderColor = "#70402f"
